# Dependabot configuration (read from the default branch only).
# One grouped weekly PR per release line keeps dependency noise low:
#   develop      -> webapp 5.0 line
#   experimental -> webapp 5.1 line
# Minor/patch bumps are grouped and auto-merged once CI passes
# (see .github/workflows/dependabot-auto-merge.yml); major bumps get
# their own group and require a manual review.

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    rebase-strategy: "auto"
    target-branch: "develop"
    labels:
      - "dependencies"
      - "5.0"
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      npm-major:
        applies-to: version-updates
        update-types:
          - "major"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    rebase-strategy: "auto"
    target-branch: "experimental"
    labels:
      - "dependencies"
      - "5.1"
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      npm-major:
        applies-to: version-updates
        update-types:
          - "major"
