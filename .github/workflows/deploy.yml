name: frontendBuild

on:
  workflow_run:
    workflows: ["Frontend Tests"]
    types: [completed]
    branches: [experimental, experimental-externalUI, devel, testing, stable]

  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: true
        default: 'devel'
        type: choice
        options:
          - stable
          - testing
          - devel
          - experimental
          - experimental-externalUI

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Only run if the triggering workflow succeeded
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      version: ${{ steps.create_version.outputs.version }}
      branch: ${{ steps.get_branch.outputs.branch }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.event.workflow_run.head_branch }}
          token: ${{ secrets.GH_PAT }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      # Generate version information
      - name: Get branch name
        id: get_branch
        run: echo "branch=$(git rev-parse --abbrev-ref HEAD)" >> $GITHUB_OUTPUT

      - name: Create version file
        id: create_version
        run: |
          BUILD_NUM=${{ github.run_number }}
          BRANCH=${{ steps.get_branch.outputs.branch }}
          VERSION="V5.0-${BUILD_NUM}-${BRANCH}"
          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M:%S UTC")

          # Generate version.js file with actual values
          sed -i "s/__APP_VERSION__/${VERSION}/g" src/version.js
          sed -i "s/__APP_BRANCH__/${BRANCH}/g" src/version.js
          sed -i "s/__BUILD_NUMBER__/${BUILD_NUM}/g" src/version.js
          sed -i "s/__BUILD_DATE__/${BUILD_DATE}/g" src/version.js

          # Save version to GITHUB_OUTPUT for later steps
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "build_date=${BUILD_DATE}" >> $GITHUB_OUTPUT

      - name: Build Quasar App
        run: npx quasar build

      # Rest of your workflow remains the same
      #- name: Run minifyFontnames.sh
      #  run: ./minifyFontnames.sh

      - name: Run gzipSPA.sh
        run: ./gzipSPA.sh

      - name: Generate icon list
        run: node generate_icon_list.js > ./fileList.h

      # Replace git describe with our consistent version
      - name: Create VERSION file
        run: |
          VERSION="${{ steps.create_version.outputs.version }}"
          echo "${VERSION}" > dist/spa/VERSION

      - name: Upload SPA files to GitHub
        uses: actions/upload-artifact@v7
        with:
          name: spa-files
          path: dist/spa/

      - name: Upload fileList.h to GitHub
        uses: actions/upload-artifact@v7
        with:
          name: fileList.h
          path: ./fileList.h

      - name: Create download page
        run: |
          BRANCH=${{ steps.get_branch.outputs.branch }}
          mkdir -p gh-pages-content
          VERSION="${{ steps.create_version.outputs.version }}"
          BUILD_DATE=$(date)
          echo "<html><body><h1>Download Artifacts - ${BRANCH}</h1><ul>" > gh-pages-content/index.html
          echo "<p>Branch: ${BRANCH}</p>" >> gh-pages-content/index.html
          echo "<p>Build Date: ${BUILD_DATE}</p>" >> gh-pages-content/index.html
          echo "<p>Version: ${VERSION}</p>" >> gh-pages-content/index.html
          echo "<li><a href='spa-files.zip'>Download SPA Files</a></li>" >> gh-pages-content/index.html
          echo "<li><a href='fileList.h'>Download fileList.h</a></li>" >> gh-pages-content/index.html
          echo "</ul>" >> gh-pages-content/index.html
          echo "</body></html>" >> gh-pages-content/index.html

      - name: Copy SPA files to download directory
        run: |
          zip -r gh-pages-content/spa-files.zip dist/spa/*

      - name: Copy fileList.h to download directory
        run: |
          cp ./fileList.h gh-pages-content/

      - name: Publish branch artifacts to gh-pages
        run: |
          BRANCH="${{ steps.get_branch.outputs.branch }}"
          PUBLISH_DIR="$RUNNER_TEMP/gh-pages-worktree"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf "$PUBLISH_DIR"

          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git worktree add "$PUBLISH_DIR" origin/gh-pages
          else
            git worktree add --detach "$PUBLISH_DIR"
            cd "$PUBLISH_DIR"
            git checkout --orphan gh-pages
            git rm -rf . >/dev/null 2>&1 || true
            touch .nojekyll
            git add .nojekyll
            git commit -m "Initialize gh-pages"
            git push origin gh-pages
            cd "$GITHUB_WORKSPACE"
            git worktree remove "$PUBLISH_DIR" --force
            git fetch origin gh-pages
            git worktree add "$PUBLISH_DIR" origin/gh-pages
          fi

          mkdir -p "$PUBLISH_DIR/$BRANCH"
          find "$PUBLISH_DIR/$BRANCH" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -a gh-pages-content/. "$PUBLISH_DIR/$BRANCH/"
          touch "$PUBLISH_DIR/.nojekyll"

          cd "$PUBLISH_DIR"
          git add .
          if git diff --cached --quiet; then
            echo "No gh-pages changes to publish"
          else
            git commit -m "Deploy frontend artifacts for $BRANCH"
            git push origin HEAD:gh-pages
          fi

          cd "$GITHUB_WORKSPACE"
          git worktree remove "$PUBLISH_DIR" --force

      - name: Wait for GitHub Pages deployment
        run: |
          echo "Waiting 30 seconds for GitHub Pages to deploy the artifacts..."
          sleep 30

      - name: Verify artifacts are accessible
        run: |
          WEBAPP_BRANCH="${{ steps.get_branch.outputs.branch }}"
          echo "Verifying artifacts at https://pljakobs.github.io/esp_rgb_webapp2/${WEBAPP_BRANCH}/"

          # Try to download spa-files.zip
          if curl -f -L -o /tmp/test-spa.zip "https://pljakobs.github.io/esp_rgb_webapp2/${WEBAPP_BRANCH}/spa-files.zip"; then
            echo "✓ spa-files.zip is accessible"
          else
            echo "✗ ERROR: spa-files.zip not yet available"
            exit 1
          fi

          # Try to download fileList.h
          if curl -f -L -o /tmp/test-filelist.h "https://pljakobs.github.io/esp_rgb_webapp2/${WEBAPP_BRANCH}/fileList.h"; then
            echo "✓ fileList.h is accessible"
          else
            echo "✗ ERROR: fileList.h not yet available"
            exit 1
          fi

          echo "All artifacts verified and accessible!"

      - name: Trigger firmware build
        run: |
          # Map webapp branch names to firmware branch names if needed
          WEBAPP_BRANCH="${{ steps.get_branch.outputs.branch }}"
          case "$WEBAPP_BRANCH" in
            "devel")
              FIRMWARE_BRANCH="develop"
              ;;
            *)
              FIRMWARE_BRANCH="$WEBAPP_BRANCH"
              ;;
          esac

          echo "Triggering firmware build for branch: $FIRMWARE_BRANCH (webapp: $WEBAPP_BRANCH)"

          # Build JSON payload
          PAYLOAD=$(cat <<EOF
          {
            "event_type": "frontend-build-completed",
            "client_payload": {
              "branch": "$FIRMWARE_BRANCH",
              "webapp_branch": "$WEBAPP_BRANCH",
              "run_id": "${{ github.run_id }}"
            }
          }
          EOF
          )

          echo "Payload:"
          echo "$PAYLOAD"

          # Use curl with verbose output
          HTTP_CODE=$(curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            -w "%{http_code}" \
            -o /tmp/response.txt \
            https://api.github.com/repos/pljakobs/esp_rgbww_firmware/dispatches \
            -d "$PAYLOAD")

          echo "HTTP Status: $HTTP_CODE"
          echo "Response:"
          cat /tmp/response.txt

          if [ "$HTTP_CODE" -ne "204" ]; then
            echo "ERROR: Failed to trigger firmware build (HTTP $HTTP_CODE)"
            exit 1
          fi

          echo "Successfully triggered firmware build"

  publish:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout firmware repository (for manage_version.py)
        uses: actions/checkout@v6
        with:
          repository: pljakobs/esp_rgbww_firmware
          ref: experimental-externalUI
          path: esp_firmware_repo
          token: ${{ secrets.GH_PAT }}

      - name: Download SPA files artifact
        uses: actions/download-artifact@v8
        with:
          name: spa-files
          path: dist/spa

      - name: Compute MD5 checksums for webapp files
        id: compute_md5
        run: |
          echo "Computing MD5s for gzipped webapp files..."
          FILES_JSON="["
          first=true
          while IFS= read -r -d '' file; do
            rel_path="${file#dist/spa/}"
            md5=$(md5sum "$file" | awk '{print $1}')
            if [ "$first" = "true" ]; then
              first=false
            else
              FILES_JSON+=","
            fi
            FILES_JSON+="{\"path\":\"${rel_path}\",\"md5\":\"${md5}\"}"
          done < <(find dist/spa -type f -name "*.gz" -print0 | sort -z)
          FILES_JSON+="]"
          echo "Computed $(echo "$FILES_JSON" | python3 -c 'import sys,json; print(len(json.load(sys.stdin)))') files"
          FILES_JSON_B64=$(echo "$FILES_JSON" | base64 -w 0)
          echo "files_json_b64=$FILES_JSON_B64" >> $GITHUB_OUTPUT

      - name: Configure deploy variables
        run: |
          echo "deploy_user=github-deploy" >> $GITHUB_ENV
          echo "deploy_server=lightinator.de" >> $GITHUB_ENV
          echo "deploy_path=/home/github-deploy/nginx/html" >> $GITHUB_ENV

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      - name: Port knock
        run: |
          if [ -n "${{ secrets.DEPLOY_KNOCK_URL }}" ]; then
            echo "Performing port knock..."
            curl -s "${{ secrets.DEPLOY_KNOCK_URL }}" || echo "Knock failed, continuing anyway..."
            sleep 2
          fi

      - name: Add server to known_hosts
        run: ssh-keyscan lightinator.de >> ~/.ssh/known_hosts

      - name: Deploy webapp to lightinator.de
        run: |
          BRANCH="${{ needs.build.outputs.branch }}"
          VERSION="${{ needs.build.outputs.version }}"

          # Prepare staging area
          mkdir -p staging/download/webui/$BRANCH/$VERSION
          cp -r dist/spa/. staging/download/webui/$BRANCH/$VERSION/
          cp esp_firmware_repo/manage_version.py staging/

          # Create the remote orchestration script.
          # GitHub Actions expressions are expanded before the shell runs;
          # single-quoted 'REMOTE_EOF' prevents local bash from expanding $VAR references
          # that are meant to be set at the top of the remote script.
          cat > staging/remote_update_webapp.sh << 'REMOTE_EOF'
          #!/bin/bash
          set -e

          DEPLOY_PATH="${{ env.deploy_path }}"
          BRANCH="${{ needs.build.outputs.branch }}"
          VERSION="${{ needs.build.outputs.version }}"
          FILES_JSON_B64="${{ steps.compute_md5.outputs.files_json_b64 }}"
          DEPLOY_SERVER="${{ env.deploy_server }}"
          BASE_URL="http://${DEPLOY_SERVER}/download/webui/${BRANCH}/${VERSION}"

          cd "$DEPLOY_PATH"
          mkdir -p "download/webui/${BRANCH}/${VERSION}"
          mkdir -p "download/webui/${BRANCH}/latest"
          chmod +x manage_version.py

          echo "Updating version.json with webapp entry for ${BRANCH} ${VERSION}..."
          python3 manage_version.py version.json add-webapp "$BRANCH" "$VERSION" "$BASE_URL" \
            --files-json-b64 "$FILES_JSON_B64"

          # Update latest pointer
          mkdir -p "download/webui/${BRANCH}/latest"
          if [ -d "download/webui/${BRANCH}/${VERSION}" ]; then
            echo "$VERSION" > "download/webui/${BRANCH}/latest/version.txt"
            printf '<html><head><meta http-equiv="refresh" content="0; URL=../%s/"></head></html>\n' \
              "$VERSION" > "download/webui/${BRANCH}/latest/index.html"
          else
            echo "Warning: download/webui/${BRANCH}/${VERSION} not found on remote"
          fi

          echo "Fixing permissions..."
          chown -R github-deploy:nginx download/webui
          find download/webui -type d -exec chmod 755 {} \;
          find download/webui -type f -exec chmod 644 {} \;
          chmod +x manage_version.py

          rm remote_update_webapp.sh
          REMOTE_EOF

          chmod +x staging/remote_update_webapp.sh

          echo "Syncing webapp files to ${{ env.deploy_server }}..."
          rsync -rlvz --chmod=Du=rwx,Dgo=rx,Fu=rw,Fgo=r \
            -e "ssh -o StrictHostKeyChecking=no" \
            staging/ ${{ env.deploy_user }}@${{ env.deploy_server }}:${{ env.deploy_path }}/

          echo "Running remote update script..."
          ssh -o StrictHostKeyChecking=no ${{ env.deploy_user }}@${{ env.deploy_server }} \
            "bash ${{ env.deploy_path }}/remote_update_webapp.sh"


