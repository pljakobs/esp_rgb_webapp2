name: frontendBuild

on:
  workflow_run:
    workflows: ["Frontend Tests"]
    types: [completed]
    branches: [experimental, develop, testing, stable, '5.0/**', '5.1/**']

  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: true
        default: '5.0/develop'
        type: choice
        options:
          - 5.0/develop
          - 5.0/testing
          - 5.0/prod
          - 5.1/develop
          - 5.1/testing
          - 5.1/prod
          - stable
          - testing
          - develop
          - experimental

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    #runs-on: ubuntu-latest
    runs-on: ubuntu-latest
    # Only run if the triggering workflow succeeded
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    outputs:
      version: ${{ steps.create_version.outputs.version }}
      branch: ${{ steps.resolve_release.outputs.release_ref }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.event.workflow_run.head_branch }}
          token: ${{ secrets.GH_PAT }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Generate version information
      - name: Get branch name
        id: get_branch
        run: echo "branch=$(git rev-parse --abbrev-ref HEAD)" >> $GITHUB_OUTPUT

      - name: Resolve release line and stage
        id: resolve_release
        env:
          CI_SOURCE_BRANCH: ${{ steps.get_branch.outputs.branch }}
        run: |
          case "$CI_SOURCE_BRANCH" in
            5.0/develop|develop) RELEASE_LINE="5.0"; STAGE="develop" ;;
            5.0/testing|testing) RELEASE_LINE="5.0"; STAGE="testing" ;;
            5.0/prod|stable) RELEASE_LINE="5.0"; STAGE="prod" ;;
            5.1/develop|experimental) RELEASE_LINE="5.1"; STAGE="develop" ;;
            5.1/testing) RELEASE_LINE="5.1"; STAGE="testing" ;;
            5.1/prod) RELEASE_LINE="5.1"; STAGE="prod" ;;
            *) echo "Unsupported webapp release ref: $CI_SOURCE_BRANCH" >&2; exit 1 ;;
          esac
          RELEASE_REF="$RELEASE_LINE/$STAGE"
          echo "release_line=$RELEASE_LINE" >> "$GITHUB_OUTPUT"
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"
          echo "release_ref=$RELEASE_REF" >> "$GITHUB_OUTPUT"

      - name: Create version file
        id: create_version
        env:
          CI_BUILD_NUMBER: ${{ github.run_number }}
          CI_RELEASE_LINE: ${{ steps.resolve_release.outputs.release_line }}
          CI_RELEASE_STAGE: ${{ steps.resolve_release.outputs.stage }}
          CI_RELEASE_REF: ${{ steps.resolve_release.outputs.release_ref }}
        run: |
          BUILD_NUM="$CI_BUILD_NUMBER"
          BRANCH="$CI_RELEASE_REF"
          VERSION="V${CI_RELEASE_LINE}-${BUILD_NUM}-${CI_RELEASE_STAGE}"
          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M:%S UTC")

          # Generate version.js file with actual values
          sed -i "s/__APP_VERSION__/${VERSION}/g" src/version.js
          sed -i "s|__APP_BRANCH__|${BRANCH}|g" src/version.js
          sed -i "s/__BUILD_NUMBER__/${BUILD_NUM}/g" src/version.js
          sed -i "s/__BUILD_DATE__/${BUILD_DATE}/g" src/version.js

          # Save version to GITHUB_OUTPUT for later steps
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "build_date=${BUILD_DATE}" >> $GITHUB_OUTPUT

      - name: Build Quasar App
        run: npx quasar build

      # Rest of your workflow remains the same
      #- name: Run minifyFontnames.sh
      #  run: ./minifyFontnames.sh

      - name: Run gzipSPA.sh
        run: ./gzipSPA.sh

      - name: Copy bootstrap HTML files into dist/spa
        run: |
          # captive.html and updating.html live at the repo root (not built by Quasar).
          # Copy them into dist/spa/ so they are included in the spa-files.zip artifact
          # and available for firmware builds that embed them as FSTR flash strings.
          cp captive.html dist/spa/captive.html
          cp updating.html dist/spa/updating.html

      - name: Generate icon list
        run: node generate_icon_list.js > ./fileList.h

      # Replace git describe with our consistent version
      - name: Create VERSION file
        run: |
          VERSION="${{ steps.create_version.outputs.version }}"
          echo "${VERSION}" > dist/spa/VERSION

      - name: Upload SPA files to GitHub
        uses: actions/upload-artifact@v7
        with:
          name: spa-files
          path: dist/spa/

      - name: Upload fileList.h to GitHub
        uses: actions/upload-artifact@v7
        with:
          name: fileList.h
          path: ./fileList.h

      - name: Create download page
        run: |
          BRANCH="${{ steps.resolve_release.outputs.release_ref }}"
          mkdir -p gh-pages-content
          VERSION="${{ steps.create_version.outputs.version }}"
          BUILD_DATE=$(date)
          echo "<html><body><h1>Download Artifacts - ${BRANCH}</h1><ul>" > gh-pages-content/index.html
          echo "<p>Branch: ${BRANCH}</p>" >> gh-pages-content/index.html
          echo "<p>Build Date: ${BUILD_DATE}</p>" >> gh-pages-content/index.html
          echo "<p>Version: ${VERSION}</p>" >> gh-pages-content/index.html
          echo "<li><a href='spa-files.zip'>Download SPA Files</a></li>" >> gh-pages-content/index.html
          echo "<li><a href='fileList.h'>Download fileList.h</a></li>" >> gh-pages-content/index.html
          echo "</ul>" >> gh-pages-content/index.html
          echo "</body></html>" >> gh-pages-content/index.html

      - name: Copy SPA files to download directory
        run: |
          zip -r gh-pages-content/spa-files.zip dist/spa/*

      - name: Copy fileList.h to download directory
        run: |
          cp ./fileList.h gh-pages-content/

      - name: Publish branch artifacts to gh-pages
        run: |
          BRANCH="${{ steps.resolve_release.outputs.release_ref }}"
          PUBLISH_DIR="$RUNNER_TEMP/gh-pages-worktree"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf "$PUBLISH_DIR"

          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git worktree add "$PUBLISH_DIR" origin/gh-pages
          else
            git worktree add --detach "$PUBLISH_DIR"
            cd "$PUBLISH_DIR"
            git checkout --orphan gh-pages
            git rm -rf . >/dev/null 2>&1 || true
            touch .nojekyll
            git add .nojekyll
            git commit -m "Initialize gh-pages"
            git push origin gh-pages
            cd "$GITHUB_WORKSPACE"
            git worktree remove "$PUBLISH_DIR" --force
            git fetch origin gh-pages
            git worktree add "$PUBLISH_DIR" origin/gh-pages
          fi

          mkdir -p "$PUBLISH_DIR/$BRANCH"
          find "$PUBLISH_DIR/$BRANCH" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -a gh-pages-content/. "$PUBLISH_DIR/$BRANCH/"
          touch "$PUBLISH_DIR/.nojekyll"

          cd "$PUBLISH_DIR"
          git add .
          if git diff --cached --quiet; then
            echo "No gh-pages changes to publish"
          else
            git commit -m "Deploy frontend artifacts for $BRANCH"
            git push origin HEAD:gh-pages
          fi

          cd "$GITHUB_WORKSPACE"
          git worktree remove "$PUBLISH_DIR" --force

      - name: Wait for GitHub Pages deployment
        run: |
          echo "Waiting 30 seconds for GitHub Pages to deploy the artifacts..."
          sleep 30

      - name: Verify artifacts are accessible
        run: |
          WEBAPP_BRANCH="${{ steps.get_branch.outputs.branch }}"
          echo "Verifying artifacts at https://pljakobs.github.io/esp_rgb_webapp2/${WEBAPP_BRANCH}/"

          # Try to download spa-files.zip
          if curl -f -L -o /tmp/test-spa.zip "https://pljakobs.github.io/esp_rgb_webapp2/${WEBAPP_BRANCH}/spa-files.zip"; then
            echo "✓ spa-files.zip is accessible"
          else
            echo "✗ ERROR: spa-files.zip not yet available"
            exit 1
          fi

          # Try to download fileList.h
          if curl -f -L -o /tmp/test-filelist.h "https://pljakobs.github.io/esp_rgb_webapp2/${WEBAPP_BRANCH}/fileList.h"; then
            echo "✓ fileList.h is accessible"
          else
            echo "✗ ERROR: fileList.h not yet available"
            exit 1
          fi

          echo "All artifacts verified and accessible!"

  publish:
    runs-on: ubuntu-latest
    #runs-on: self-hosted
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    env:
      deploy_user: github-deploy
      deploy_server: lightinator.de
      deploy_path: /home/github-deploy/nginx/html
      DISTRIBUTION_PUBLISHER_SHA: ${{ vars.DISTRIBUTION_PUBLISHER_SHA }}

    steps:
      - name: Validate publisher pin
        run: |
          [[ "$DISTRIBUTION_PUBLISHER_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Set DISTRIBUTION_PUBLISHER_SHA to a reviewed distribution-server commit SHA"
            exit 1
          }

      - name: Checkout pinned distribution publisher
        uses: actions/checkout@v6
        with:
          repository: pljakobs/lightinator_server
          ref: ${{ env.DISTRIBUTION_PUBLISHER_SHA }}
          path: distribution_publisher
          persist-credentials: false

      - name: Test pinned distribution publisher
        run: |
          set -euo pipefail
          test "$(git -C distribution_publisher rev-parse HEAD)" = "$DISTRIBUTION_PUBLISHER_SHA"
          test "$(python3 distribution_publisher/manage_version.py --publisher-contract)" = "lightinator-sqlite-v1"
          python3 -m venv "$RUNNER_TEMP/publisher-venv"
          "$RUNNER_TEMP/publisher-venv/bin/pip" install -r distribution_publisher/requirements-test.txt
          cd distribution_publisher
          "$RUNNER_TEMP/publisher-venv/bin/python" -m unittest discover -s tests -v

      - name: Download SPA files artifact
        uses: actions/download-artifact@v8
        with:
          name: spa-files
          path: dist/spa

      - name: Validate downloaded SPA artifact
        run: |
          if [ ! -d dist/spa ]; then
            echo "ERROR: dist/spa directory not found after artifact download"
            exit 1
          fi

          FILE_COUNT=$(find dist/spa -type f | wc -l)
          echo "Downloaded SPA file count: $FILE_COUNT"
          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "ERROR: No SPA files downloaded"
            exit 1
          fi

      - name: Compute MD5 checksums for webapp files
        id: compute_md5
        run: |
          echo "Computing MD5s for gzipped webapp files..."
          FILES_JSON="["
          first=true
          while IFS= read -r -d '' file; do
            rel_path="${file#dist/spa/}"
            md5=$(md5sum "$file" | awk '{print $1}')
            if [ "$first" = "true" ]; then
              first=false
            else
              FILES_JSON+=","
            fi
            FILES_JSON+="{\"path\":\"${rel_path}\",\"md5\":\"${md5}\"}"
          done < <(find dist/spa -type f -name "*.gz" -print0 | sort -z)
          FILES_JSON+="]"
          echo "Computed $(echo "$FILES_JSON" | python3 -c 'import sys,json; print(len(json.load(sys.stdin)))') files"
          FILES_JSON_B64=$(echo "$FILES_JSON" | base64 -w 0)
          echo "files_json_b64=$FILES_JSON_B64" >> $GITHUB_OUTPUT

      - name: Setup SSH and deploy
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      - name: Configure variables
        run: |
          echo "deploy_user=github-deploy" >> $GITHUB_ENV
          echo "deploy_server=lightinator.de" >> $GITHUB_ENV
          echo "deploy_path=/home/github-deploy/nginx/html" >> $GITHUB_ENV

      - name: Port knock
        run: |
          if [ -n "${{ secrets.DEPLOY_KNOCK_URL }}" ]; then
            echo "Performing port knock..."
            curl -s "${{ secrets.DEPLOY_KNOCK_URL }}" || echo "Knock failed, continuing anyway..."
            sleep 2
          fi

      - name: Add server to known_hosts
        run: ssh-keyscan lightinator.de >> ~/.ssh/known_hosts

      - name: Deploy webapp to lightinator.de
        run: |
          BRANCH="${{ needs.build.outputs.branch }}"
          VERSION="${{ needs.build.outputs.version }}"

          # Prepare staging area
          mkdir -p staging/download/webui/$BRANCH/$VERSION
          cp -r dist/spa/. staging/download/webui/$BRANCH/$VERSION/
          PUBLISHER_DIR="publisher-webapp-${{ github.run_id }}-${{ github.run_attempt }}"
          mkdir -p "staging/$PUBLISHER_DIR"
          cp distribution_publisher/manage_version.py "staging/$PUBLISHER_DIR/manage_version-${{ github.run_id }}-${{ github.run_attempt }}.py"
          cp distribution_publisher/version_api.py distribution_publisher/migrate_to_sqlite.py "staging/$PUBLISHER_DIR/"
          cp -r distribution_publisher/images "staging/$PUBLISHER_DIR/"
          printf '%s\n' "$DISTRIBUTION_PUBLISHER_SHA" > "staging/$PUBLISHER_DIR/SOURCE_REVISION"

          LOCAL_WEBAPP_FILE_COUNT=$(find staging/download/webui/$BRANCH/$VERSION -type f | wc -l)
          echo "Staged webapp file count for deployment: $LOCAL_WEBAPP_FILE_COUNT"
          if [ "$LOCAL_WEBAPP_FILE_COUNT" -eq 0 ]; then
            echo "ERROR: Staging area has no webapp files"
            exit 1
          fi

          # Create the remote orchestration script.
          # GitHub Actions expressions are expanded before the shell runs;
          # single-quoted 'REMOTE_EOF' prevents local bash from expanding $VAR references
          # that are meant to be set at the top of the remote script.
          cat > "staging/remote_update_webapp-${{ github.run_id }}-${{ github.run_attempt }}.sh" << 'REMOTE_EOF'
          #!/bin/bash
          set -e

          DEPLOY_PATH="${{ env.deploy_path }}"
          BRANCH="${{ needs.build.outputs.branch }}"
          VERSION="${{ needs.build.outputs.version }}"
          FILES_JSON_B64="${{ steps.compute_md5.outputs.files_json_b64 }}"
          DEPLOY_SERVER="${{ env.deploy_server }}"
          PUBLISHER_DIR="publisher-webapp-${{ github.run_id }}-${{ github.run_attempt }}"
          MANAGE_SCRIPT="$PUBLISHER_DIR/manage_version-${{ github.run_id }}-${{ github.run_attempt }}.py"
          MANAGE_PYTHON="/home/github-deploy/lightinator-server/.venv/bin/python"
          export VERSION_DB_PATH="${VERSION_DB_PATH:-/home/github-deploy/lightinator-server/firmware.db}"

          case "$BRANCH" in
            */prod|*/testing|stable|testing)
              WEBAPP_TYPE="release"
              ;;
            *)
              WEBAPP_TYPE="debug"
              ;;
          esac

          if [[ "$VERSION" =~ ^[Vv]?([0-9]+)\.([0-9]+) ]]; then
            MIN_FIRMWARE="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.0"
          else
            MIN_FIRMWARE="0.0.0"
          fi

          cd "$DEPLOY_PATH"
          export VERSION_ASSET_ROOT="$DEPLOY_PATH"
          test -f "$MANAGE_SCRIPT" && test -x "$MANAGE_PYTHON"
          test "$(cat "$PUBLISHER_DIR/SOURCE_REVISION")" = "${{ env.DISTRIBUTION_PUBLISHER_SHA }}"
          test "$("$MANAGE_PYTHON" "$MANAGE_SCRIPT" --publisher-contract)" = "lightinator-sqlite-v1"
          mkdir -p "download/webui/${BRANCH}/${VERSION}"
          mkdir -p "download/webui/${BRANCH}/latest"

          echo "Publishing webapp entry to SQLite for ${BRANCH} ${VERSION}..."
          "$MANAGE_PYTHON" "$MANAGE_SCRIPT" version.json add-webapp "$BRANCH" "$VERSION" \
            --type "$WEBAPP_TYPE" \
            --min-firmware "$MIN_FIRMWARE" \
            --files-json-b64 "$FILES_JSON_B64"

          # Update latest pointer
          mkdir -p "download/webui/${BRANCH}/latest"
          if [ -d "download/webui/${BRANCH}/${VERSION}" ]; then
            echo "$VERSION" > "download/webui/${BRANCH}/latest/version.txt"
            printf '<html><head><meta http-equiv="refresh" content="0; URL=../%s/"></head></html>\n' \
              "$VERSION" > "download/webui/${BRANCH}/latest/index.html"
          else
            echo "Warning: download/webui/${BRANCH}/${VERSION} not found on remote"
          fi

          echo "Fixing permissions..."
          chown -R github-deploy:nginx download/webui
          find download/webui -type d -exec chmod 755 {} \;
          find download/webui -type f -exec chmod 644 {} \;

          rm -r -- "$PUBLISHER_DIR"
          rm "remote_update_webapp-${{ github.run_id }}-${{ github.run_attempt }}.sh"
          REMOTE_EOF

          chmod +x "staging/remote_update_webapp-${{ github.run_id }}-${{ github.run_attempt }}.sh"

          echo "Syncing webapp files to ${{ env.deploy_server }}..."
          rsync -rlvz --chmod=Du=rwx,Dgo=rx,Fu=rw,Fgo=r \
            -e "ssh -o StrictHostKeyChecking=no" \
            staging/ ${{ env.deploy_user }}@${{ env.deploy_server }}:${{ env.deploy_path }}/

          echo "Running remote update script..."
          ssh -o StrictHostKeyChecking=no ${{ env.deploy_user }}@${{ env.deploy_server }} \
            "flock /tmp/lightinator-webapp-deploy.lock bash ${{ env.deploy_path }}/remote_update_webapp-${{ github.run_id }}-${{ github.run_attempt }}.sh"

          echo "Verifying remote deployment contents..."
          REMOTE_WEBAPP_FILE_COUNT=$(ssh -o StrictHostKeyChecking=no ${{ env.deploy_user }}@${{ env.deploy_server }} \
            "find ${{ env.deploy_path }}/download/webui/$BRANCH/$VERSION -type f | wc -l")
          echo "Remote webapp file count: $REMOTE_WEBAPP_FILE_COUNT"
          if [ -z "$REMOTE_WEBAPP_FILE_COUNT" ] || [ "$REMOTE_WEBAPP_FILE_COUNT" -eq 0 ]; then
            echo "ERROR: No webapp files found on remote after deployment"
            exit 1
          fi


