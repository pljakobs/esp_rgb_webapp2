name: Frontend Tests

on:
  push:
    branches:
      - experimental
      - develop
      - testing
      - stable
      - "5.0/**"
      - "5.1/**"
  pull_request:
    branches:
      - experimental
      - develop
      - testing
      - stable
      - "5.0/**"
      - "5.1/**"

jobs:
  test:
    #runs-on: ubuntu-latest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Run frontend unit tests
        run: npm test

      - name: Test summary
        if: always()
        run: |
          echo "## Frontend Checks" >> $GITHUB_STEP_SUMMARY
          echo "- ESLint (flat config) over all .js/.vue sources" >> $GITHUB_STEP_SUMMARY
          echo "- Full vitest unit test suite" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_Note: Integration tests require running firmware and are executed manually_" >> $GITHUB_STEP_SUMMARY

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Quasar app
        run: npx quasar build
