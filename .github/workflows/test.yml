name: Frontend Tests

on:
  push:
    branches:
      - experimental
      - develop
      - testing
      - stable
      - "5.0/**"
      - "5.1/**"
  pull_request:
    branches:
      - experimental
      - develop
      - testing
      - stable
      - "5.0/**"
      - "5.1/**"

jobs:
  test:
    #runs-on: ubuntu-latest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Run frontend unit tests
        run: npm test

      - name: Build production frontend
        run: npm run build

      - name: Verify four-file OTA bundle
        run: |
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import { readdirSync } from "node:fs";

          const files = readdirSync("dist/spa", { recursive: true })
            .filter(file => file.endsWith(".gz"))
            .sort();
          console.log(JSON.stringify(files, null, 2));
          assert.equal(files.length, 4, "Expected exactly four OTA files");
          assert.equal(files.filter(file => file.endsWith(".js.gz")).length, 1);
          assert.equal(files.filter(file => file.endsWith(".css.gz")).length, 1);
          assert(files.includes("index.html.gz"));
          assert(files.includes("icons/iconsSprite.svg.gz"));
          JS

      - name: Test summary
        if: always()
        run: |
          echo "## Frontend Checks" >> $GITHUB_STEP_SUMMARY
          echo "- ESLint (flat config) over all .js/.vue sources" >> $GITHUB_STEP_SUMMARY
          echo "- Full vitest unit test suite" >> $GITHUB_STEP_SUMMARY
          echo "- Production build with four-file OTA bundle verification" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Lint, unit tests and production build are required gates.**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_Note: Integration tests require running firmware and are executed manually_" >> $GITHUB_STEP_SUMMARY

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Quasar app
        run: npx quasar build
