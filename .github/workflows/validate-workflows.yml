name: Workflow Validation

on:
  pull_request:
  push:
    paths:
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Workflow validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install validation dependencies
        run: python -m pip install -r .github/requirements-validation.txt

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: false

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Lint every workflow
        run: '"$(go env GOPATH)/bin/actionlint" -color -shellcheck= .github/workflows/*.yml'

      - name: Test workflow syntax and policies
        run: python -m unittest discover -s .github/tests -v