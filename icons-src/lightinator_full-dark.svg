<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 64" width="100%" height="100%">
  <defs>
    <!-- Leuchteffekt für den Mittelpunkt im Dunkeln -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Symbol / Icon (Links) -->
  <g transform="translate(0, 0)">
    <!-- Äußerer gestrichelter Kreis (Hell/Cyan für Dark Mode) -->
    <circle cx="32" cy="32" r="26" fill="none" stroke="#3274d9" stroke-width="2" stroke-dasharray="4 4" opacity="0.6" />
    
    <!-- Verbindungslinien -->
    <line x1="32" y1="6" x2="32" y2="58" stroke="#3274d9" stroke-width="1.5" opacity="0.4" />
    <line x1="9.5" y1="19" x2="54.5" y2="45" stroke="#3274d9" stroke-width="1.5" opacity="0.4" />
    <line x1="9.5" y1="45" x2="54.5" y2="19" stroke="#3274d9" stroke-width="1.5" opacity="0.4" />
    
    <!-- Knotenpunkte (Nodes) mit angepassten Leuchtfarben -->
    <circle cx="32" cy="6" r="4" fill="#3274d9" />
    <circle cx="54.5" cy="19" r="3.5" fill="#3274d9" />
    <circle cx="54.5" cy="45" r="3.5" fill="#00d2ff" />
    <circle cx="32" cy="58" r="4" fill="#00d2ff" />
    <circle cx="9.5" cy="45" r="3.5" fill="#00b074" />
    <circle cx="9.5" cy="19" r="3.5" fill="#ffbb33" />
    
    <!-- Zentraler Hub / Kern -->
    <circle cx="32" cy="32" r="7" fill="#181b1f" stroke="#00d2ff" stroke-width="2.5" filter="url(#glow)" />
    <circle cx="32" cy="32" r="2.5" fill="#ffffff" />
  </g>

  <!-- Schriftzug "Lightinator" (Weiß/Hell für Dark Mode) -->
  <text x="75" y="41" font-family="&#39;Inter&#39;, &#39;Helvetica Neue&#39;, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" fill="#ffffff" letter-spacing="0.5">Lightinator</text>
</svg>