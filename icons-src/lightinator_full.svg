<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <!-- Light Glow Gradient with #1976D2 as Key Color -->
    <linearGradient id="glowGrad2D" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1976D2" />
      <stop offset="50%" stop-color="#4ECDC4" />
      <stop offset="100%" stop-color="#FFD166" />
    </linearGradient>
    <radialGradient id="centerGlow2D" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1976D2" stop-opacity="1"/>
      <stop offset="100%" stop-color="#4ECDC4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Icon: Symmetrical 2D Mesh -->
  <g transform="translate(10, 10)">
    <!-- Flat Orbit Ring -->
    <circle cx="50" cy="50" r="38" fill="none" stroke="url(#glowGrad2D)" stroke-width="2" stroke-dasharray="4 3" opacity="0.5"/>

    <!-- Symmetrical Radial Spokes -->
    <line x1="50" y1="50" x2="50" y2="12" stroke="url(#glowGrad2D)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="50" y1="50" x2="82.9" y2="31" stroke="url(#glowGrad2D)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="50" y1="50" x2="82.9" y2="69" stroke="url(#glowGrad2D)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="50" y1="50" x2="50" y2="88" stroke="url(#glowGrad2D)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="50" y1="50" x2="17.1" y2="69" stroke="url(#glowGrad2D)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="50" y1="50" x2="17.1" y2="31" stroke="url(#glowGrad2D)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Outer Rim Connections -->
    <polygon points="50,12 82.9,31 82.9,69 50,88 17.1,69 17.1,31" fill="none" stroke="url(#glowGrad2D)" stroke-width="1.5" opacity="0.3"/>

    <!-- Outer Nodes -->
    <circle cx="50" cy="12" r="4" fill="#1976D2"/>
    <circle cx="82.9" cy="31" r="4" fill="#2196F3"/>
    <circle cx="82.9" cy="69" r="4" fill="#00BCD4"/>
    <circle cx="50" cy="88" r="4" fill="#4ECDC4"/>
    <circle cx="17.1" cy="69" r="4" fill="#10B981"/>
    <circle cx="17.1" cy="31" r="4" fill="#FFD166"/>

    <!-- Dead Center Hub -->
    <circle cx="50" cy="50" r="14" fill="url(#centerGlow2D)"/>
    <circle cx="50" cy="50" r="7" fill="#FFFFFF"/>
  </g>

  <!-- Typography -->
  <text x="120" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="42" fill="#0F172A" letter-spacing="-0.5">
    LIGHT<tspan fill="#1976D2">INATOR</tspan>
  </text>
  <text x="122" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12" fill="#64748B" letter-spacing="2">
    MESHED LED CONTROL PLATFORM
  </text>
</svg>
