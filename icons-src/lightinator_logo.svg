<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1976D2" />
      <stop offset="50%" stop-color="#4ECDC4" />
      <stop offset="100%" stop-color="#FFD166" />
    </linearGradient>
    <radialGradient id="sparkCenterGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1976D2" stop-opacity="1"/>
      <stop offset="100%" stop-color="#4ECDC4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Outer Orbit Ring -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="url(#sparkGrad)" stroke-width="2" stroke-dasharray="4 3" opacity="0.5"/>

  <!-- Radial Spokes -->
  <line x1="50" y1="50" x2="50" y2="12" stroke="url(#sparkGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="82.9" y2="31" stroke="url(#sparkGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="82.9" y2="69" stroke="url(#sparkGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="50" y2="88" stroke="url(#sparkGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="17.1" y2="69" stroke="url(#sparkGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="17.1" y2="31" stroke="url(#sparkGrad)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Outer Rim Connections -->
  <polygon points="50,12 82.9,31 82.9,69 50,88 17.1,69 17.1,31" fill="none" stroke="url(#sparkGrad)" stroke-width="1.5" opacity="0.3"/>

  <!-- Outer Nodes -->
  <circle cx="50" cy="12" r="4" fill="#1976D2"/>
  <circle cx="82.9" cy="31" r="4" fill="#2196F3"/>
  <circle cx="82.9" cy="69" r="4" fill="#00BCD4"/>
  <circle cx="50" cy="88" r="4" fill="#4ECDC4"/>
  <circle cx="17.1" cy="69" r="4" fill="#10B981"/>
  <circle cx="17.1" cy="31" r="4" fill="#FFD166"/>

  <!-- Dead Center Hub -->
  <circle cx="50" cy="50" r="14" fill="url(#sparkCenterGlow)"/>
  <circle cx="50" cy="50" r="7" fill="#FFFFFF"/>
</svg>
