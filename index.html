<!doctype html>
<html>
  <head>
    <title><%= productName %></title>
    <meta name="lightinator-demo" content="1" />
    <script>
      window.onerror = function (msg, url, line) {
        console.log("CRITICAL BOOT FAILURE: " + msg + "\nURL: " + url);
        // You could even make a fetch call back to Sming to log the error to the Serial console
        const params = new URLSearchParams(window.location.search);
        if (String(msg).includes("Invalid home controller address")) {
          document.body.textContent = "Invalid home controller address in URL. Use an IPv4 address or hostname.";
          return false;
        }
        if (params.get("demo") === "1" || params.has("home")) return false;
        fetch("/system", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            cmd: "debug_log",
            param: {
              level: "3",
              text:
                "CRITICAL BOOT FAILURE: " +
                msg +
                "\nURL: " +
                url +
                "\nLINE: " +
                line,
            },
          }),
        });
        return false;
      };
    </script>

    <meta charset="utf-8" />
    <meta name="description" content="<%= productDescription %>" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta
      name="viewport"
      content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width"
    />

    <link rel="icon" type="image/ico" href="/icons/favicon.ico" />
  </head>
  <body>
    <!-- quasar:entry-point -->
  </body>
</html>
